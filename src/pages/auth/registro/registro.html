<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../login/loginStyle.css">
    <link rel="stylesheet" href="../../../globalStyles.css" />
    <title>Registro</title>
</head>

<body>
    <div class="header_marca">
        <img src="/assets/logo_food_store.png" alt="Food Store logo" class="logo_img"/>
          <span class="logo_nombre_primario">FOOD STORE</span>
    </div>
    <br>
    <h3>Registrar un nuevo cliente</h3>
    <div class="form-container">
        <form id="form-registro" class="form">
            <div>
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" autocomplete="off" placeholder="example@example.com" required>
            </div>
            <div>
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="off" placeholder="********" required>
            </div>

            <button type="submit" class="login_button">Registrar</button>
        </form>
    </div>
    <br>
    <p>Volver al <a href="../login/login.html">Login</a></p>

    <script type="module" src="./registro.ts"></script>
</body>

</html>
