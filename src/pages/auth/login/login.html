<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./loginStyle.css">
    <link rel="stylesheet" href="../../../globalStyles.css" />
    <title>Login</title>
</head>

<body>
    <div class="header_marca">
        <img src="/assets/logo_food_store.png" alt="Food Store logo" class="logo_img"/>
          <span class="logo_nombre_primario">FOOD STORE</span>
    </div>
    <div class="form-container">
        <form id="form-login" class="form">
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="off" placeholder="example@example.com" required>
            </div>
            <div>
                <label for="password">password</label>
                <input type="password" id="password" name="password" autocomplete="off" placeholder="********" required>
            </div>

            <button type="submit" class="login_button">Ingresar</button>

        </form>
    </div>
    <br>
    <p>Para crear una cuenta de cliente <a href="../registro/registro.html">Registro aquí</a></p>
    <br><br>
    <p class="anuncio">
        Usuario precargado para iniciar sesión: <br>
         Login como client: email: client@mail.com | contraseña: client <br>
        
        
    </p>
    
    <script type="module" src="./login.ts"></script>

</body>

</html>
